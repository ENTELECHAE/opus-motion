name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify CLI Commands
        run: |
          python cli.py --help
          python cli.py styles --category Cinema
          python cli.py prompts --tech threejs --limit 5
          python cli.py voice --list
          python cli.py proxy

      - name: Validate Catalog JSON Integrity
        run: |
          python -m unittest tests/test_catalog.py
